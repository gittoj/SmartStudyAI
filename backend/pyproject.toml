[project]
name = "smartstudy-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi", "uvicorn[standard]", "pydantic>=2", "pydantic-settings",
  "sqlalchemy[asyncio]>=2", "asyncpg", "alembic", "python-multipart",
  "argon2-cffi", "itsdangerous", "pymupdf", "openai", "email-validator",
]
[dependency-groups]
dev = ["pytest", "pytest-asyncio", "pytest-cov", "httpx"]
